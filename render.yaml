services:
  - type: cron
    name: newgradnotifier-daily
    env: python
    plan: starter
    schedule: "0 12,13 * * *"
    buildCommand: "pip install -e '.[postgres]'"
    startCommand: "python -m newgrad_notifier.cli --config config/production.toml run-once"
    envVars:
      - key: EMAIL_RECIPIENT
        value: dzmchenry@gmail.com
      - key: EMAIL_SENDER
        value: NewGrad Notifier <onboarding@resend.dev>
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: dzmchenry@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_TLS
        value: "true"
      - key: IMMEDIATE_ALERTS_ENABLED
        value: "true"
      - key: IMMEDIATE_ALERT_THRESHOLD
        value: "92"
      - key: DB_BACKEND
        value: sqlite
      - key: SQLITE_PATH
        value: ./data/newgradnotifier.db
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-thinking
      - key: RUN_TIME_LOCAL
        value: 08:00
      - key: TIME_ZONE
        value: America/New_York
