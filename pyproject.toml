[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newgrad-notifier"
version = "0.1.0"
description = "Daily discovery, ranking, and notification pipeline for new-grad software engineering roles."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10,<4",
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "lxml>=5.2,<6",
  "openai>=1.65,<2",
  "playwright>=1.49,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "python-dateutil>=2.9,<3",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0,<3",
  "tenacity>=9.0,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
newgrad-notifier = "newgrad_notifier.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"newgrad_notifier.config" = ["*.json", "*.toml"]
