name: Daily Job Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12,13 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: newgrad-notifier-production
  cancel-in-progress: false

jobs:
  run-daily-pipeline:
    if: github.event_name == 'workflow_dispatch' || vars.SCHEDULE_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EMAIL_RECIPIENT: ${{ vars.EMAIL_RECIPIENT || 'dzmchenry@gmail.com' }}
      EMAIL_SENDER: ${{ vars.EMAIL_SENDER || 'NewGrad Notifier <onboarding@resend.dev>' }}
      EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'resend' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USERNAME: ${{ vars.SMTP_USERNAME || 'dzmchenry@gmail.com' }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_TLS: ${{ vars.SMTP_TLS || 'true' }}
      IMMEDIATE_ALERTS_ENABLED: ${{ vars.IMMEDIATE_ALERTS_ENABLED || 'true' }}
      IMMEDIATE_ALERT_THRESHOLD: ${{ vars.IMMEDIATE_ALERT_THRESHOLD || '92' }}
      FAILURE_ALERTS_ENABLED: ${{ vars.FAILURE_ALERTS_ENABLED || 'true' }}
      SEND_EMPTY_DIGEST: ${{ vars.SEND_EMPTY_DIGEST || 'false' }}
      TRACKING_ENABLED: "false"
      DB_BACKEND: sqlite
      SQLITE_PATH: ./data/newgradnotifier.db
      OPENAI_ENABLED: "false"
      RUN_TIME_LOCAL: ${{ vars.RUN_TIME_LOCAL || '08:00' }}
      TIME_ZONE: ${{ vars.TIME_ZONE || 'America/New_York' }}
      SCHEDULE_START_DATE: 2026-07-01
      SQLITE_ARTIFACT_NAME: newgradnotifier-sqlite-state
      SQLITE_RESTORE_REQUIRED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install -e . --no-deps

      - name: Restore previous SQLite state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/restore_sqlite_from_artifact.py

      - name: Gate duplicate or early scheduled triggers
        id: schedule_gate
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: .venv/bin/python scripts/should_run_schedule.py

      - name: Stop when today's pipeline already ran or the trigger is early
        if: github.event_name == 'schedule' && steps.schedule_gate.outcome != 'success'
        run: echo "Skipping this trigger; another trigger will run or today's pipeline already completed."

      - name: Run production preflight
        if: github.event_name != 'schedule' || steps.schedule_gate.outcome == 'success'
        run: .venv/bin/python scripts/production_preflight.py

      - name: Run production pipeline
        if: github.event_name != 'schedule' || steps.schedule_gate.outcome == 'success'
        run: .venv/bin/newgrad-notifier --config config/production.toml run-once

      - name: Upload SQLite state
        if: github.event_name != 'schedule' || steps.schedule_gate.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: newgradnotifier-sqlite-state
          path: data/newgradnotifier.db
          if-no-files-found: error
          retention-days: 30

      - name: Send failure alert
        if: failure()
        run: python scripts/send_failure_alert.py
