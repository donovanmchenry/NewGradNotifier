name: Delinea Job Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: delinea-job-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.event_name == 'workflow_dispatch' || vars.COMPANY_WATCH_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EMAIL_RECIPIENT: ${{ vars.EMAIL_RECIPIENT || 'dzmchenry@gmail.com' }}
      EMAIL_SENDER: ${{ vars.EMAIL_SENDER || 'NewGrad Notifier <onboarding@resend.dev>' }}
      EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'resend' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USERNAME: ${{ vars.SMTP_USERNAME || 'dzmchenry@gmail.com' }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_TLS: ${{ vars.SMTP_TLS || 'true' }}
      OPENAI_ENABLED: "false"
      COMPANY_WATCH_ENABLED: "true"
      COMPANY_WATCH_STATE_PATH: ./data/delinea-watch-state.json
      COMPANY_STATE_ARTIFACT_NAME: delinea-watch-state-v1
      FAILURE_ALERTS_ENABLED: ${{ vars.FAILURE_ALERTS_ENABLED || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install -e . --no-deps
      - name: Restore notification history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: .venv/bin/python scripts/restore_company_watch_state.py
      - name: Check Delinea
        id: watch
        run: .venv/bin/newgrad-notifier --config config/production.toml watch-company
      - name: Persist notification history even after a partial email failure
        if: always() && steps.watch.outcome != 'skipped' && hashFiles('data/delinea-watch-state.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: delinea-watch-state-v1
          path: data/delinea-watch-state.json
          if-no-files-found: error
          retention-days: 90
      - name: Send failure alert
        if: failure()
        run: python scripts/send_failure_alert.py
