name: zero2sudo Browser Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install -e . --no-deps

      - name: Probe viewer in Google Chrome
        run: xvfb-run -a .venv/bin/python scripts/probe_story_viewer.py

      - name: Add probe result to run summary
        if: always() && hashFiles('artifacts/story-probe/summary.md') != ''
        run: cat artifacts/story-probe/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zero2sudo-browser-probe
          path: artifacts/story-probe/
          if-no-files-found: error
          retention-days: 1
