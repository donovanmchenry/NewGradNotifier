name: zero2sudo Story Watch

on:
  workflow_dispatch:
    inputs:
      notify_existing:
        description: Send currently visible Stories instead of creating a silent baseline
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [zero2sudo-story-watch]
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: zero2sudo-story-watch
  cancel-in-progress: false

jobs:
  check-stories:
    if: github.event_name == 'workflow_dispatch' || vars.STORY_WATCH_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EMAIL_RECIPIENT: ${{ vars.EMAIL_RECIPIENT || 'dzmchenry@gmail.com' }}
      EMAIL_SENDER: ${{ vars.EMAIL_SENDER || 'NewGrad Notifier <onboarding@resend.dev>' }}
      EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'resend' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USERNAME: ${{ vars.SMTP_USERNAME || 'dzmchenry@gmail.com' }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_TLS: ${{ vars.SMTP_TLS || 'true' }}
      FAILURE_ALERTS_ENABLED: ${{ vars.FAILURE_ALERTS_ENABLED || 'true' }}
      OPENAI_ENABLED: "false"
      STORY_WATCH_ENABLED: "true"
      STORY_WATCH_USERNAME: zero2sudo
      STORY_WATCH_URL: https://insta-stories-viewer.com/zero2sudo/
      STORY_WATCH_STATE_PATH: ./data/zero2sudo-story-state.json
      STORY_WATCH_NOTIFY_EXISTING: ${{ inputs.notify_existing || 'false' }}
      STORY_WATCH_OCR_ENABLED: ${{ vars.STORY_WATCH_OCR_ENABLED || 'true' }}
      STORY_WATCH_ATTACH_IMAGES: ${{ vars.STORY_WATCH_ATTACH_IMAGES || 'true' }}
      STORY_WATCH_MAX_ATTACHMENT_BYTES: ${{ vars.STORY_WATCH_MAX_ATTACHMENT_BYTES || '25165824' }}
      STORY_STATE_ARTIFACT_NAME: zero2sudo-story-state-browser-v1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install -e . --no-deps

      - name: Install media and OCR tools when needed
        if: env.STORY_WATCH_OCR_ENABLED == 'true'
        run: |
          if ! command -v tesseract >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes ffmpeg tesseract-ocr
          fi

      - name: Restore prior Story state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: .venv/bin/python scripts/restore_story_state_from_artifact.py

      - name: Check for new Stories
        run: xvfb-run -a .venv/bin/newgrad-notifier --config config/production.toml watch-stories

      - name: Persist Story state
        uses: actions/upload-artifact@v7
        with:
          name: zero2sudo-story-state-browser-v1
          path: data/zero2sudo-story-state.json
          if-no-files-found: error
          retention-days: 1

      - name: Send failure alert
        if: failure()
        run: python scripts/send_failure_alert.py
