environment = "production"
log_level = "INFO"
cache_dir = ".cache/newgrad-notifier"

[database]
backend = "sqlite"
sqlite_path = "./data/newgradnotifier.db"
url = "sqlite:///./data/newgradnotifier.db"
echo = false

[email]
provider = "resend"
recipient = "dzmchenry@gmail.com"
sender = "NewGrad Notifier <onboarding@resend.dev>"
resend_api_key = ""
smtp_host = "smtp.gmail.com"
smtp_port = 587
smtp_username = "dzmchenry@gmail.com"
smtp_password = ""
smtp_use_tls = true
outbox_dir = "outbox"

[llm]
provider = "openai"
model = "gpt-5-mini"
fallback_models = ["gpt-4.1-mini"]
openai_api_key = ""
enabled = true

[schedule]
run_time_local = "08:00"
timezone = "America/New_York"
immediate_alerts_enabled = true
immediate_alert_threshold = 92

[thresholds]
digest_min_fit = 65
top_priority_fit = 78
high_signal_fit = 65

[filters]
remote_preference = "mixed"
allowed_locations = ["United States", "Remote"]
excluded_locations = []
excluded_companies = []
excluded_job_families = [
  "QA",
  "IT Support",
  "Help Desk",
  "Analyst",
  "Sales Engineer",
  "Developer Advocate",
  "Embedded",
  "Firmware",
  "Hardware",
]
priority_companies = [
  "Google",
  "Meta",
  "Microsoft",
  "Amazon",
  "Apple",
  "Stripe",
  "Databricks",
  "Uber",
  "Airbnb",
  "Adobe",
  "NVIDIA",
  "Capital One",
  "Bloomberg",
]
keywords = [
  "software engineer new grad",
  "new grad software engineer",
  "university graduate software engineer",
  "early career software engineer",
  "software engineer i",
  "associate software engineer",
  "product engineer",
  "frontend engineer",
  "backend engineer",
  "full stack engineer",
]

[[structured_feeds]]
name = "simplify_new_grad"
url = "https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json"
format = "json"
job_path = ""
company_key = "company_name"
title_key = "title"
url_key = "url"
location_key = "locations"
posted_at_key = "date_posted"
description_key = ""
job_id_key = "id"

[company_coverage]
list_path = ""

[web_search]
provider = "duckduckgo_html"
max_results_per_query = 10
queries = []
fixture_path = ""
