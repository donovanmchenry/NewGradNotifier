environment = "production"
log_level = "INFO"
cache_dir = ".cache/newgrad-notifier"

[database]
backend = "sqlite"
sqlite_path = "./data/newgradnotifier.db"
url = "sqlite:///./data/newgradnotifier.db"
echo = false

[email]
provider = "resend"
recipient = "dzmchenry@gmail.com"
sender = "NewGrad Notifier <onboarding@resend.dev>"
resend_api_key = ""
smtp_host = "smtp.gmail.com"
smtp_port = 587
smtp_username = "dzmchenry@gmail.com"
smtp_password = ""
smtp_use_tls = true
outbox_dir = "outbox"

[llm]
provider = "openai"
model = "gpt-4.1-mini"
fallback_models = ["gpt-4o-mini"]
openai_api_key = ""
enabled = true

[schedule]
run_time_local = "08:00"
timezone = "America/New_York"
immediate_alerts_enabled = true
immediate_alert_threshold = 92

[thresholds]
digest_min_fit = 60
top_priority_fit = 72
high_signal_fit = 65
max_digest_jobs = 8

[collection]
max_company_pages_per_run = 75
max_jobs_per_source = 500
max_description_fetches_per_run = 30
min_description_characters = 160
max_job_age_days = 45
min_domain_interval_seconds = 0.25

[filters]
remote_preference = "mixed"
allowed_locations = ["United States", "Remote"]
excluded_locations = []
excluded_companies = []
excluded_job_families = [
  "QA",
  "IT Support",
  "Help Desk",
  "Analyst",
  "Sales Engineer",
  "Developer Advocate",
  "Embedded",
  "Firmware",
  "Hardware",
]
priority_companies = [
  "Google",
  "Meta",
  "Microsoft",
  "Amazon",
  "Apple",
  "Stripe",
  "Databricks",
  "Uber",
  "Airbnb",
  "Adobe",
  "NVIDIA",
  "Capital One",
  "Bloomberg",
]
keywords = [
  "software engineer new grad",
  "new grad software engineer",
  "university graduate software engineer",
  "early career software engineer",
  "software engineer i",
  "associate software engineer",
  "product engineer",
  "frontend engineer",
  "backend engineer",
  "full stack engineer",
]

[[structured_feeds]]
name = "new_grad_jobs_repo"
url = "https://raw.githubusercontent.com/ambicuity/New-Grad-Jobs/main/docs/jobs.json"
format = "json"
job_path = "jobs"
company_key = "company"
title_key = "title"
url_key = "url"
location_key = "location"
posted_at_key = "posted_at"
description_key = "description"
job_id_key = "id"
closed_key = "is_closed"

[[structured_feeds]]
name = "simplify_new_grad"
url = "https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json"
format = "json"
job_path = ""
company_key = "company_name"
title_key = "title"
url_key = "url"
location_key = "locations"
posted_at_key = "date_posted"
description_key = ""
job_id_key = "id"

[[markdown_feeds]]
name = "speedyapply_2027"
url = "https://raw.githubusercontent.com/speedyapply/2026-SWE-College-Jobs/main/NEW_GRAD_USA.md"
max_age_days = 45

[company_coverage]
list_path = ""

[web_search]
provider = "duckduckgo_html"
max_results_per_query = 10
queries = []
fixture_path = ""

[sources]
simplify_enabled = true
ats_enabled = true
company_pages_enabled = false
web_search_enabled = false
